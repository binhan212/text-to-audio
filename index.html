<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển văn bản thành giọng nói tiếng Việt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #faf5f0, #f5ede5);
            color: #5c4033;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: linear-gradient(135deg, #fffbf7, #fef8f3);
            border: 1px solid rgba(210, 180, 140, .35);
            box-shadow: 0 10px 40px rgba(139, 90, 43, .08);
        }
        .label {
            display: flex;
            align-items: center;
            gap: .55rem;
            margin-bottom: .65rem;
            color: #5c4033;
            font-weight: 650;
        }
        .label i { color: #c89968; }
        .upload {
            padding: 1.4rem;
            border: 2px dashed rgba(200, 153, 104, .45);
            border-radius: .9rem;
            background: rgba(255, 255, 255, .45);
            text-align: center;
            cursor: pointer;
            transition: .2s ease;
        }
        .upload:hover, .upload.dragover {
            border-color: #c89968;
            background: rgba(212, 165, 116, .1);
        }
        textarea, select {
            width: 100%;
            border: 2px solid rgba(210, 180, 140, .4);
            border-radius: .8rem;
            background: #fffbf7;
            color: #5c4033;
            outline: none;
        }
        textarea:focus, select:focus {
            border-color: #d4a574;
            box-shadow: 0 0 0 3px rgba(212, 165, 116, .12);
        }
        .settings {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding: 1rem;
            border: 1px solid rgba(210, 180, 140, .3);
            border-radius: .8rem;
            background: rgba(212, 165, 116, .05);
        }
        input[type="range"] { width: 100%; accent-color: #c89968; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .55rem;
            width: 100%;
            padding: .85rem 1rem;
            border-radius: .8rem;
            color: white;
            font-weight: 700;
            transition: .2s ease;
        }
        .btn:hover { transform: translateY(-1px); filter: brightness(.96); }
        .btn:disabled { cursor: not-allowed; opacity: .6; transform: none; }
        .btn-convert { background: linear-gradient(135deg, #d4a574, #b88856); }
        .btn-preview { background: linear-gradient(135deg, #86bc86, #67a767); }
        .btn-download { background: linear-gradient(135deg, #75b6d5, #559fc3); }
        .status {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .85rem 1rem;
            border-radius: .75rem;
            font-weight: 550;
        }
        .status.info { color: #2d4a5c; background: #e8f4f9; }
        .status.success { color: #2d5a2d; background: #eaf5ea; }
        .status.error { color: #752f2f; background: #f9e8e8; }
        @media (max-width: 640px) {
            .settings { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="px-4 py-8">
    <main class="mx-auto max-w-3xl">
        <header class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-amber-100 shadow">
                <i class="fas fa-volume-high text-3xl text-amber-700"></i>
            </div>
            <h1 class="mb-2 text-3xl font-bold text-amber-950 sm:text-4xl">Giọng đọc tiếng Việt</h1>
            <p class="text-amber-800">Chuyển văn bản hoặc file .txt thành audio tiếng Việt</p>
        </header>

        <section class="card space-y-7 rounded-3xl p-5 sm:p-8">
            <div>
                <div class="label"><i class="fas fa-file-arrow-up"></i>File văn bản</div>
                <div id="uploadArea" class="upload" role="button" tabindex="0">
                    <input id="fileInput" class="hidden" type="file" accept=".txt,text/plain">
                    <i class="fas fa-cloud-arrow-up mb-3 text-4xl text-amber-600"></i>
                    <p class="font-semibold text-amber-950">Kéo thả file .txt hoặc nhấn để chọn</p>
                    <p id="fileName" class="mt-1 text-sm text-amber-700">Tối đa 1 file văn bản</p>
                </div>
            </div>

            <div>
                <div class="label"><i class="fas fa-pen"></i>Nội dung cần đọc</div>
                <textarea id="textInput" class="h-44 resize-y p-4" maxlength="10000"
                    placeholder="Nhập nội dung tiếng Việt tại đây..."></textarea>
                <p class="mt-2 text-right text-sm text-amber-700"><span id="charCount">0</span>/10.000 ký tự</p>
            </div>

            <div>
                <label class="label" for="voiceSelect"><i class="fas fa-microphone"></i>Giọng tiếng Việt</label>
                <select id="voiceSelect" class="p-3">
                    <option value="">Đang tìm giọng tiếng Việt trên thiết bị...</option>
                </select>
                <p id="voiceHint" class="mt-2 text-sm text-amber-700"></p>
            </div>

            <div class="settings">
                <label>
                    <span class="mb-2 flex justify-between text-sm font-semibold">Tốc độ <b id="rateValue">1.0x</b></span>
                    <input id="rate" type="range" min="0.5" max="2" value="1" step="0.1">
                </label>
                <label>
                    <span class="mb-2 flex justify-between text-sm font-semibold">Cao độ <b id="pitchValue">1.0</b></span>
                    <input id="pitch" type="range" min="0.5" max="2" value="1" step="0.1">
                </label>
                <label>
                    <span class="mb-2 flex justify-between text-sm font-semibold">Âm lượng <b id="volumeValue">100%</b></span>
                    <input id="volume" type="range" min="0" max="1" value="1" step="0.1">
                </label>
            </div>

            <div id="status" class="status info hidden" role="status" aria-live="polite"></div>

            <div id="convertActions">
                <button id="convertBtn" class="btn btn-convert">
                    <i class="fas fa-wand-magic-sparkles"></i>
                    <span>Chuyển thành audio</span>
                </button>
            </div>

            <div id="resultActions" class="hidden grid-cols-1 gap-3 sm:grid-cols-2">
                <button id="previewBtn" class="btn btn-preview">
                    <i class="fas fa-play"></i>
                    <span>Nghe trước</span>
                </button>
                <button id="downloadBtn" class="btn btn-download">
                    <i class="fas fa-download"></i>
                    <span>Tải xuống</span>
                </button>
            </div>
        </section>
    </main>

    <script>
        const synth = window.speechSynthesis;
        const fileInput = document.getElementById("fileInput");
        const uploadArea = document.getElementById("uploadArea");
        const fileName = document.getElementById("fileName");
        const textInput = document.getElementById("textInput");
        const charCount = document.getElementById("charCount");
        const voiceSelect = document.getElementById("voiceSelect");
        const voiceHint = document.getElementById("voiceHint");
        const rateInput = document.getElementById("rate");
        const pitchInput = document.getElementById("pitch");
        const volumeInput = document.getElementById("volume");
        const convertBtn = document.getElementById("convertBtn");
        const convertActions = document.getElementById("convertActions");
        const resultActions = document.getElementById("resultActions");
        const previewBtn = document.getElementById("previewBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const statusBox = document.getElementById("status");

        let vietnameseVoices = [];
        let convertedContent = "";

        function showStatus(message, type = "info") {
            const icon = type === "success" ? "fa-circle-check" :
                type === "error" ? "fa-circle-exclamation" : "fa-circle-info";
            statusBox.className = `status ${type}`;
            statusBox.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
        }

        function loadVietnameseVoices() {
            vietnameseVoices = synth.getVoices().filter(
                voice => voice.lang.toLowerCase().startsWith("vi")
            );
            voiceSelect.innerHTML = "";

            if (!vietnameseVoices.length) {
                voiceSelect.innerHTML = '<option value="">Không tìm thấy giọng tiếng Việt</option>';
                voiceHint.textContent = "Hãy cài giọng Vietnamese (vi-VN) trong phần ngôn ngữ của hệ điều hành rồi tải lại trang.";
                convertBtn.disabled = true;
                return;
            }

            vietnameseVoices
                .sort((a, b) => Number(b.default) - Number(a.default))
                .forEach((voice, index) => {
                    const option = document.createElement("option");
                    option.value = voice.name;
                    option.textContent = `${voice.name} (${voice.lang})${voice.default ? " — mặc định" : ""}`;
                    if (index === 0) option.selected = true;
                    voiceSelect.appendChild(option);
                });
            voiceHint.textContent = `Đã tìm thấy ${vietnameseVoices.length} giọng tiếng Việt trên thiết bị.`;
            convertBtn.disabled = false;
        }

        function selectedVoice() {
            return vietnameseVoices.find(voice => voice.name === voiceSelect.value) || vietnameseVoices[0];
        }

        function createUtterance(content) {
            const utterance = new SpeechSynthesisUtterance(content);
            utterance.lang = "vi-VN";
            utterance.voice = selectedVoice();
            utterance.rate = Number(rateInput.value);
            utterance.pitch = Number(pitchInput.value);
            utterance.volume = Number(volumeInput.value);
            return utterance;
        }

        function resetConversion() {
            synth.cancel();
            convertedContent = "";
            convertActions.classList.remove("hidden");
            resultActions.classList.add("hidden");
            resultActions.classList.remove("grid");
        }

        function readFile(file) {
            if (!file || (!file.name.toLowerCase().endsWith(".txt") && file.type !== "text/plain")) {
                showStatus("Vui lòng chọn đúng file .txt.", "error");
                return;
            }
            const reader = new FileReader();
            reader.onload = event => {
                textInput.value = String(event.target.result).slice(0, 10000);
                charCount.textContent = textInput.value.length.toLocaleString("vi-VN");
                fileName.textContent = `Đã chọn: ${file.name}`;
                resetConversion();
                showStatus("Đã đọc nội dung từ file thành công.", "success");
            };
            reader.onerror = () => showStatus("Không thể đọc file này.", "error");
            reader.readAsText(file, "UTF-8");
        }

        uploadArea.addEventListener("click", () => fileInput.click());
        uploadArea.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") fileInput.click();
        });
        fileInput.addEventListener("change", () => readFile(fileInput.files[0]));
        uploadArea.addEventListener("dragover", event => {
            event.preventDefault();
            uploadArea.classList.add("dragover");
        });
        uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragover"));
        uploadArea.addEventListener("drop", event => {
            event.preventDefault();
            uploadArea.classList.remove("dragover");
            readFile(event.dataTransfer.files[0]);
        });

        textInput.addEventListener("input", () => {
            charCount.textContent = textInput.value.length.toLocaleString("vi-VN");
            resetConversion();
        });
        [voiceSelect, rateInput, pitchInput, volumeInput].forEach(control => {
            control.addEventListener("change", resetConversion);
        });
        rateInput.addEventListener("input", () => rateValue.textContent = `${Number(rateInput.value).toFixed(1)}x`);
        pitchInput.addEventListener("input", () => pitchValue.textContent = Number(pitchInput.value).toFixed(1));
        volumeInput.addEventListener("input", () => volumeValue.textContent = `${Math.round(volumeInput.value * 100)}%`);

        convertBtn.addEventListener("click", () => {
            const content = textInput.value.trim();
            if (!content) {
                showStatus("Hãy nhập văn bản hoặc chọn một file .txt trước.", "error");
                textInput.focus();
                return;
            }
            if (!selectedVoice()) {
                showStatus("Thiết bị chưa có giọng đọc tiếng Việt.", "error");
                return;
            }

            convertedContent = content;
            convertActions.classList.add("hidden");
            resultActions.classList.remove("hidden");
            resultActions.classList.add("grid");
            showStatus("Đã chuyển xong. Bạn có thể nghe trước hoặc tải xuống.", "success");
        });

        previewBtn.addEventListener("click", () => {
            if (!convertedContent) return;
            if (synth.speaking) {
                synth.cancel();
                previewBtn.innerHTML = '<i class="fas fa-play"></i><span>Nghe trước</span>';
                showStatus("Đã dừng nghe trước.", "info");
                return;
            }
            const utterance = createUtterance(convertedContent);
            utterance.onstart = () => {
                previewBtn.innerHTML = '<i class="fas fa-stop"></i><span>Dừng nghe</span>';
                showStatus("Đang phát giọng đọc tiếng Việt...", "info");
            };
            utterance.onend = () => {
                previewBtn.innerHTML = '<i class="fas fa-play"></i><span>Nghe trước</span>';
            };
            utterance.onerror = () => {
                previewBtn.innerHTML = '<i class="fas fa-play"></i><span>Nghe trước</span>';
                showStatus("Không thể phát giọng đọc trên trình duyệt này.", "error");
            };
            synth.speak(utterance);
        });

        downloadBtn.addEventListener("click", async () => {
            if (!convertedContent) return;
            if (!navigator.mediaDevices?.getDisplayMedia || !window.MediaRecorder) {
                showStatus("Trình duyệt này chưa hỗ trợ xuất audio. Hãy dùng Chrome hoặc Edge phiên bản mới.", "error");
                return;
            }

            synth.cancel();
            downloadBtn.disabled = true;
            showStatus('Chọn tab hiện tại và bật “Chia sẻ âm thanh của tab” để tạo file tải xuống.', "info");

            let captureStream;
            try {
                captureStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true,
                    preferCurrentTab: true,
                    selfBrowserSurface: "include"
                });

                const audioTracks = captureStream.getAudioTracks();
                if (!audioTracks.length) {
                    throw new Error("NO_SHARED_AUDIO");
                }

                const audioStream = new MediaStream(audioTracks);
                const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
                    ? "audio/webm;codecs=opus"
                    : "audio/webm";
                const recorder = new MediaRecorder(audioStream, { mimeType });
                const chunks = [];

                recorder.addEventListener("dataavailable", event => {
                    if (event.data.size) chunks.push(event.data);
                });
                recorder.addEventListener("stop", () => {
                    captureStream.getTracks().forEach(track => track.stop());
                    if (!chunks.length) {
                        showStatus("Không thu được âm thanh. Hãy thử lại và nhớ bật chia sẻ âm thanh của tab.", "error");
                        downloadBtn.disabled = false;
                        return;
                    }
                    const blob = new Blob(chunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = `giong-doc-tieng-viet-${Date.now()}.webm`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    downloadBtn.disabled = false;
                    showStatus("Đã tạo và tải file audio tiếng Việt.", "success");
                });

                const utterance = createUtterance(convertedContent);
                utterance.onend = () => setTimeout(() => {
                    if (recorder.state !== "inactive") recorder.stop();
                }, 300);
                utterance.onerror = () => {
                    if (recorder.state !== "inactive") recorder.stop();
                    showStatus("Không thể tạo giọng đọc trên trình duyệt này.", "error");
                };
                captureStream.getVideoTracks()[0]?.addEventListener("ended", () => {
                    synth.cancel();
                    if (recorder.state !== "inactive") recorder.stop();
                });

                recorder.start(100);
                setTimeout(() => synth.speak(utterance), 250);
                showStatus("Đang tạo audio, vui lòng chờ giọng đọc chạy hết...", "info");
            } catch (error) {
                captureStream?.getTracks().forEach(track => track.stop());
                downloadBtn.disabled = false;
                const message = error.message === "NO_SHARED_AUDIO"
                    ? "Bạn chưa bật chia sẻ âm thanh của tab. Hãy nhấn tải lại và bật tùy chọn này."
                    : "Đã hủy tạo file audio hoặc trình duyệt không cấp quyền chia sẻ tab.";
                showStatus(message, "error");
            }
        });

        loadVietnameseVoices();
        if ("onvoiceschanged" in synth) synth.onvoiceschanged = loadVietnameseVoices;
    </script>
</body>
</html>
